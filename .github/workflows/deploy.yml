name: Deploy to GitHub Pages

# Release-gated: a push to `main` does NOT deploy. The live site only
# updates when a GitHub Release is published (operator runs
# `gh release create vX.Y.Z` after `/release-readiness`), or when this
# workflow is manually dispatched. This decouples "merge work to main"
# from "publish to production" — main can accumulate unreleased changes
# without changing the live site. CI (`ci.yml`) still build-checks every
# PR, so breakage is caught before merge, not at release time.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default: the build job, which runs `pnpm install` and the
# build, holds only `contents: read`. The Pages grants live on the deploy
# job alone, which runs no repository code.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git credentials after checkout.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a production build: a cache is writable
          # by any default-branch run, and this job's output is the live
          # site. A cold `pnpm install --frozen-lockfile` is the cost.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium (for the CV PDF)
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate cv.pdf from the built /cv/ page
        run: pnpm build:pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # deploy-pages proves its origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
