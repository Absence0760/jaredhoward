name: Deploy to GitHub Pages

# Release-gated: a push to `main` does NOT deploy. The live site only
# updates when a GitHub Release is published (operator runs
# `gh release create vX.Y.Z` after `/release-readiness`), or when this
# workflow is manually dispatched. This decouples "merge work to main"
# from "publish to production" — main can accumulate unreleased changes
# without changing the live site. CI (`ci.yml`) still build-checks every
# PR, so breakage is caught before merge, not at release time.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium (for the CV PDF)
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate cv.pdf from the built /cv/ page
        run: pnpm build:pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
